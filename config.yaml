system:
  # Konkurensi: 20-30 aman untuk laptop, 50-100 untuk VPS
  max_threads: 25
  # Timeout per proses (detik)
  timeout: 3600
  # Batas RAM (%). Jika > 90%, scan akan PAUSE otomatis.
  ram_threshold: 90.0
  # Folder penyimpanan hasil scan
  storage_path: "./scans"

ai:
  enabled: true
  model: "llama3"
  host: "http://localhost:11434/api/generate"
  # Waktu tunggu AI berpikir
  timeout: 60

scope:
  # Domain yang dilarang disentuh
  exclude_domains: ["google.com", "gov", "mil"]
  # Ekstensi file sampah yang tidak perlu discan
  exclude_ext: "png,jpg,jpeg,gif,css,js,woff,svg,ico"